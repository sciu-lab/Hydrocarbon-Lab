name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar regresiones críticas
        run: npm run test:critical

      - name: Ejecutar la batería completa antes de publicar
        run: npm test

      - name: Construir la versión estática
        run: npm run build:pages

      - name: Validar rutas y recursos del artefacto
        run: npm run validate:pages

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
